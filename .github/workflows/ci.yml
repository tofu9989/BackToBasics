name: C calculator CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Windows executable
        run: gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Ithird_party/cjson json_cal.c third_party/cjson/cJSON.c -o json_cal.exe
      - name: Test Windows executable
        run: python tests/test_json_cal.py
